name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flashcards-webapp/package-lock.json

      - name: Instaliraj zavisnosti
        working-directory: flashcards-webapp
        run: npm ci

      - name: Generiši Prisma klijenta
        working-directory: flashcards-webapp
        run: npx prisma generate

      - name: Pokreni testove
        working-directory: flashcards-webapp
        run: npm test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flashcards-webapp/package-lock.json

      - name: Instaliraj zavisnosti
        working-directory: flashcards-webapp
        run: npm ci

      - name: Generiši Prisma klijenta
        working-directory: flashcards-webapp
        run: npx prisma generate

      - name: Build Next.js aplikacije
        working-directory: flashcards-webapp
        run: npm run build

      - name: Build Docker image
        working-directory: flashcards-webapp
        run: docker build -t flashcards-webapp .